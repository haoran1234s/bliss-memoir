<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 移动端优先：撑满刘海屏安全区、禁止系统双击缩放（检视层用自研手势缩放） -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f5f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="幸福回忆录 · Bliss Memoir — 珍藏每一刻的专属回忆画册" />
    <title>幸福回忆录 · Bliss Memoir</title>
    <script>
      (function () {
        var dark = false;
        try {
          var saved = localStorage.getItem('bliss-theme');
          dark = saved
            ? saved === 'dark'
            : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        if (dark) {
          document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', '#0a0a0b');
        }
      })();
    </script>
    <style>
      /* 首屏底色：与 --bg 保持一致，避免闪白或暗色模式切换闪烁 */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f6f5f2;
      }
      html.dark,
      html.dark body {
        background: #0a0a0b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
